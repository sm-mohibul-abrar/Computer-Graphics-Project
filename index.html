<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Dictator's Dash 3D</title>
  <link rel="stylesheet" href="web/css/style.css">
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <canvas id="c"></canvas>

  <!-- In-Game Heads-Up Display -->
  <div id="hud">
    <div id="hp" class="p">
      HP <span id="ht"></span>
      <div id="hb"><div id="hf"></div></div>
    </div>
    <div id="sc" class="p">
      SCORE<b id="sv">0</b>
    </div>
    <div id="cn" class="p"></div>
    <div id="cv"></div>
    <div id="sp" class="p"><span id="st"></span></div>
  </div>

  <!-- Damage Screen Flash Overlay -->
  <div id="fl"></div>

  <!-- Menu / Game Over / Pause Dialog Modal -->
  <div id="ov">
    <div class="box" id="bx"></div>
  </div>

  <!-- Core Libraries & Game Logic -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="web/js/game.js"></script>
</body>
</html>
